<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bill</title>
  <style>
    body { font-family: Arial; background-color: #f9f9f9; padding: 20px; }
    .bill { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
    h2 { text-align: center; }
  </style>
</head>
<body>
  <div class="bill">
    <h2>Bill</h2>
    <p><strong>Name:</strong> {{ booking.name }}</p>
    <p><strong>Email:</strong> {{ booking.email }}</p>
    <p><strong>Movie:</strong> {{ booking.movie }}</p>
    <p><strong>Date:</strong> {{ booking.date }}</p>
    <p><strong>Time:</strong> {{ booking.time }}</p>
    <p><strong>Seats:</strong> {{ booking.seats }}</p>
    <p><strong>Price per Ticket:</strong> Rs.{{ booking.price_per_ticket }}</p>
    <p><strong>Total Price:</strong> Rs.{{ booking.total_price }}</p>
  </div>
</body>
</html>
