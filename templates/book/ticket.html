<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Movie Ticket Booking</title>
  <style>
    body { font-family: Arial; background-color: #f2f2f2; padding: 20px; }
    form, .layout { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
    label, input, select { display: block; margin-bottom: 10px; width: 100%; }
    input[readonly] { background-color: #eee; }
    .seat-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 10px; }
    .seat {
      width: 100%; padding: 8px 0; text-align: center;
      border-radius: 4px; cursor: pointer; background-color: #ccc;
    }
    .seat.selected { background-color: #4CAF50; color: white; }
    .seat.occupied { background-color: #888; cursor: not-allowed; }
    button { background: #4CAF50; color: white; padding: 10px; border: none; border-radius: 4px; margin-top: 15px; width: 100%; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Book Your Movie Ticket</h2>

  <form id="bookingForm" method="post" action="{% url 'book_ticket' %}">
    {% csrf_token %}

    <label for="name">Your Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>



    
    <label for="movie">Select Movie:</label>
    <select id="movie" name="movie" required>
      <option value="Oon ko sweater">Oon ko sweater</option>
      <option value="HOUSEFULL 5">HOUSEFULL 5</option>
      <option value="KHEL">KHEL</option>
      <option value="RAID 2">RAID 2</option>
      <option value="HIT:The 3rd case">HIT:The 3rd case</option>
      <option value="ke ghar ke dera no.2">ke ghar ke dera no.2</option>
    </select>

    <label for="date">Date:</label>
    <input type="date" id="date" name="date" required>

    <label for="time">Show Time:</label>
    <select id="time" name="time" required>
      <option value="10:00 AM">10:00 AM</option>
      <option value="2:00 PM">2:00 PM</option>
      <option value="6:00 PM">6:00 PM</option>
      <option value="9:00 PM">9:00 PM</option>
      <option value="11:00 PM">11:00 AM</option>
    </select>

    <label>Choose Your Seats:</label>
    <div class="seat-grid" id="seatGrid"></div>

    <label for="pricePerSeat">Price per Ticket (Rs.):</label>
    <input type="text" id="pricePerSeat" name="price_per_ticket" value="300" readonly>

    <label for="selectedSeats">Selected Seats:</label>
    <input type="text" id="selectedSeats" name="seats" readonly>

    <label for="totalPrice">Total Price (Rs.):</label>
    <input type="text" id="totalPrice" name="total_price" readonly>

    <button type="submit">Book Now</button>
  </form>

  <script>
    const seatGrid = document.getElementById("seatGrid");
    const selectedSeatsInput = document.getElementById("selectedSeats");
    const totalPriceInput = document.getElementById("totalPrice");
    const pricePerSeat = parseInt(document.getElementById("pricePerSeat").value);
    const rows = 5, cols = 8;

    for (let i = 0; i < rows * cols; i++) {
      const seat = document.createElement("div");
      seat.classList.add("seat");
      seat.dataset.seat = `S${i + 1}`;
      seat.textContent = `S${i + 1}`;
      seat.addEventListener("click", () => {
        if (seat.classList.contains("occupied")) return;
        seat.classList.toggle("selected");
        updateSelection();
      });
      seatGrid.appendChild(seat);
    }

    function updateSelection() {
      const selected = document.querySelectorAll(".seat.selected");
      const selectedNumbers = [...selected].map(seat => seat.dataset.seat);
      selectedSeatsInput.value = selectedNumbers.join(", ");
      totalPriceInput.value = selectedNumbers.length * pricePerSeat;
    }
  </script>
</body>
</html>
